server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Sem isto o nginx não comprime o que vem da API — e /api/valorant/weapons
    # tem 3,44 MB de JSON.
    gzip_proxied any;

    # A API mora em outro container, mas para o navegador é a mesma origem:
    # sem CORS, sem URL de API diferente entre dev e produção.
    # DNS interno do Docker, resolvido a cada 10 s: se o container da API
    # reiniciar e trocar de IP, o nginx acompanha sem precisar ser reiniciado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Arquivos com hash no nome (main-ABC123.js) nunca mudam: cache de 1 ano.
    location ~* "-[0-9a-z]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /midia/ {
        expires 30d;
        try_files $uri =404;
    }

    # Fallback de SPA: /agentes/<uuid> aberto direto ou com F5 cai no
    # index.html e o roteador do Angular resolve. Era o 404 do GitHub Pages.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html não pode ficar em cache, senão o navegador continua pedindo
    # os bundles antigos depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
