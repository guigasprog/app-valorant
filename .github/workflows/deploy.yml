name: CI/CD Coolify Local

on:
  push:
    branches:
      - main  # Ou 'master', dependendo do nome da sua branch principal

jobs:
  deploy:
    runs-on: self-hosted  # <--- Isso força o comando a rodar no seu servidor Linux local

    steps:
      - name: Trigger Coolify Deploy
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL }}'
