name: CI/CD Coolify Local

on:
  push:
    branches:
      - main  # Certifique-se de que é a branch que você está subindo (main ou master)

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Trigger Coolify Deploy
        run: |
          curl --request POST "http://localhost:8000/api/v1/applications/mfueyg5fing6xihbquvdj6yt/deploy" \
               --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
               --header "Content-Type: application/json"
