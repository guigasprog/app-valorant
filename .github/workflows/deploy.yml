name: CI/CD Coolify Local

on:
  push:
    branches:
      - main  # Lembre-se de verificar se sua branch atual é 'main' ou 'master'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Trigger Coolify Deploy
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
